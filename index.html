<style>
:root{color-scheme:light;--bg:#f6f4f2;--glass:rgba(255,255,255,.76);--fill:rgba(118,118,128,.12);--sep:rgba(60,60,67,.16);
--l1:#111;--l2:rgba(60,60,67,.66);--l3:rgba(60,60,67,.32);--tint:#ff8a00;--tintT:#c25700;--green:#34c759;--greenT:#1d8a3a;--redT:#d70015;
--nav:rgba(252,250,248,.82);--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px -16px rgba(60,40,20,.18)}
:root[data-theme]{color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--l1);font:17px/1.45 -apple-system,"SF Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;letter-spacing:-.01em;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}


/* nav */
.nav{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);transition:background .2s,box-shadow .2s}
.nav.solid{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.navin{max-width:640px;margin:auto;height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px}
.ntitle{font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.nav.titled .ntitle{opacity:1}
.nbtn{display:inline-flex;align-items:center;gap:2px;color:var(--tintT);min-height:44px;min-width:44px;font-size:17px}
.nbtn.end{justify-self:end}
.nbtn[hidden]{display:inline-flex;visibility:hidden}
.nbtn svg.i{width:26px;height:26px}
.help{width:30px;height:30px;min-width:30px;min-height:30px;border-radius:50%;background:var(--fill);color:var(--l2);font-weight:700;font-size:16px;justify-content:center;justify-self:end;margin:7px}

main{max-width:640px;margin:auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
.lt{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:2px 4px 2px;text-wrap:balance}
.lsub{color:var(--l2);font-size:15px;margin:2px 4px 16px}
.gh{font-size:13px;font-weight:600;color:var(--l2);margin:26px 16px 8px}
.gf{font-size:13px;color:var(--l2);margin:8px 16px 0;line-height:1.4}
.group{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 16px;width:100%;text-align:start}
.cell+.cell::before,.cell+.sugg::before{content:"";position:absolute;top:0;inset-inline-start:var(--indent,16px);inset-inline-end:0;border-top:.5px solid var(--sep)}
.cell.av-row{--indent:66px}
.cell.tap{transition:background .15s}.cell.tap:active{background:var(--fill)}
.cell .tx{flex:1;display:flex;flex-direction:column;gap:1px}
.cell .tx small{color:var(--l2);font-size:14px}
.cell .tr{color:var(--l2);display:flex;align-items:center;gap:6px;font-size:16px}
.chev{width:9px;height:15px;color:var(--l3);flex:none}
.cell.act-row{color:var(--tintT)}
.cell.danger{color:var(--redT)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg.i{width:18px;height:18px}
.pos{color:var(--greenT);font-weight:600}.neg{color:var(--redT);font-weight:600}.okc{color:var(--greenT);font-weight:600}

.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:#fff;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,.12)}
.av img{width:100%;height:100%;object-fit:cover}
.stack{display:flex;padding-inline-start:8px}
.stack .av{width:30px;height:30px;font-size:13px;margin-inline-start:-8px;border:2px solid #fff}
.stack .more{background:var(--fill);color:var(--l2);text-shadow:none}

.tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px -6px rgba(0,0,0,.35)}
.tile svg.i{width:26px;height:26px}

/* home cards */
.pc{display:block;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);margin-bottom:12px;transition:transform .15s}
.pc:active{transform:scale(.985)}
.pc-top{display:flex;align-items:center;gap:12px}
.pc-top .tx{flex:1}
.pc-top b{display:block;font-size:18px;font-weight:600}
.pc-top small{color:var(--l2);font-size:14px}
.pc-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep)}
.todo{font-size:14px;font-weight:600;padding:5px 12px;border-radius:99px;background:rgba(255,138,0,.14);color:var(--tintT);white-space:nowrap}
.todo.ok{background:rgba(52,199,89,.14);color:var(--greenT)}
.todo.wait{background:var(--fill);color:var(--l2)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:608px;margin:auto;z-index:4}

/* buttons */
.pill{min-height:52px;border-radius:14px;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fill);transition:transform .12s,background .2s,color .2s;padding:0 18px}
.pill:active{transform:scale(.97)}
.pill.pri{background:linear-gradient(180deg,#ff9d2e,#ff7a00);color:#fff;box-shadow:0 10px 24px -12px rgba(255,120,0,.8)}
.pill.wide{width:100%}
.pill:disabled{opacity:.5;cursor:default}

/* step strip */
.steps{display:flex;align-items:center;gap:6px;margin:0 2px 12px;font-size:13px;color:var(--l2);font-weight:500}
.steps>div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.steps span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:12px;font-weight:700}
.steps span svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;fill:none}
.steps .on{color:var(--l1);font-weight:600}.steps .on span{background:var(--tint);color:#fff}
.steps .done span{background:var(--green)}
.steps i{flex:1;height:2px;border-radius:2px;background:var(--fill);min-width:10px}

/* the action card */
.act{position:relative;border-radius:24px;padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 20px 44px -22px var(--g2);overflow:hidden}
.act::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;top:-120px;left:-90px;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);pointer-events:none}
.act .k{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px}
.act h2{font-size:clamp(26px,7vw,32px);line-height:1.2;font-weight:700;margin:12px 0 4px;letter-spacing:-.02em;text-wrap:balance}
.act p{margin:0;opacity:.92;font-size:16px}
.act .cd{font-size:clamp(36px,11vw,46px);font-weight:600;letter-spacing:0;line-height:1.1;margin-top:10px}
.act .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.28);margin:12px 0 6px;overflow:hidden}
.act .bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width 1s linear}
.act .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:16px}
.act .pill{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.act .pill.w{background:#fff;color:var(--g2)}
.act .pill.wide{margin-top:16px}
.act .lnk{display:inline-block;margin-top:12px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px;opacity:.95;min-height:32px}
.act .field{width:100%;min-height:48px;border-radius:12px;border:0;background:rgba(255,255,255,.22);color:#fff;padding:0 14px;font-size:17px;margin-top:14px}
.act .field::placeholder{color:rgba(255,255,255,.8)}
.act .acct{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;margin-top:14px}
.act .acct>span{flex:1;min-width:0}.act .acct b.ltr{display:block;word-break:break-all;font-size:15px;line-height:1.3}
.act .acct .copy{flex:none}
.act .acct small{display:block;font-size:12px;opacity:.85}
.act .acct .copy{color:#fff;background:rgba(255,255,255,.22);border-radius:99px;padding:0 12px;min-height:34px;font-size:14px}
.act .stack .av{border-color:rgba(255,255,255,.7)}
.act .big{font-size:clamp(44px,13vw,58px);font-weight:600;letter-spacing:0;line-height:1.05;margin-top:8px}
.act .big em{font-style:normal;font-size:20px;font-weight:600;opacity:.85;margin-inline-start:4px}
.cdl{display:flex;align-items:center;gap:6px;font-size:15px;margin-top:2px!important}
.poll{display:grid;gap:14px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:start;color:#fff}
.oc{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.85);display:grid;place-items:center;flex:none;transition:background .2s}
.oc svg{width:15px;height:15px;stroke:var(--g2);stroke-width:3.4;fill:none;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s var(--ease)}
.opt.on .oc{background:#fff}.opt.on .oc svg{opacity:1;transform:none}
.ol{flex:1;min-width:0}
.ot{display:flex;align-items:center;gap:8px}.ot b{flex:1;font-size:19px;font-weight:600}
.ot .cnt{font-weight:600;font-size:16px;min-width:14px;text-align:end}
.stack.sm .av{width:24px;height:24px;font-size:11px;margin-inline-start:-7px;border-width:1.5px}
.obar{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.28);margin-top:7px;overflow:hidden}
.obar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.seev{display:block;width:calc(100% + 40px);margin:18px -20px -18px;padding:15px;border-top:1px solid rgba(255,255,255,.28);color:#fff;font-weight:600;font-size:16px}
.seev:active{background:rgba(255,255,255,.12)}
.ringrow{display:flex;align-items:center;gap:16px;margin-top:12px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg) scaleY(-1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;font-weight:600;font-size:18px}
.ring .fg{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}

/* reminders circle */
.chk{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--l3);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s var(--ease)}
.chk.on{background:var(--green);border-color:var(--green)}.chk.on svg{opacity:1;transform:none}
.chk:disabled{opacity:.5}
.done .tx b{color:var(--l2)}
.tg .tsumm{display:flex;align-items:center;gap:12px;padding:14px 16px}
.tsumm .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.tsumm b{font-size:22px;font-weight:600;letter-spacing:0}.tsumm b span{font-size:15px;font-weight:500;color:var(--l2)}
.tsumm small{color:var(--l2);font-size:13px}
.tbar{display:block;height:6px;border-radius:3px;background:rgba(52,199,89,.16);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.trow{gap:10px}.trow::before{inset-inline-start:66px!important}
.trb{display:flex!important;flex-direction:row!important;align-items:center;gap:12px;text-align:start}
.trb>span{display:flex;flex-direction:column}.trb b{font-weight:500}.trb small{color:var(--l1)!important;font-weight:600;font-size:15px!important}
.trow.done .trb b,.trow.done .trb small{color:var(--l2)!important;font-weight:400}
.tst{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;min-height:34px;padding:0 12px;border-radius:17px;background:var(--fill);color:var(--l2);white-space:nowrap}
.tst svg.i{width:15px;height:15px;stroke-width:2.6}
.tst.ok{background:rgba(52,199,89,.14);color:var(--greenT)}
.tst.go{background:var(--tint);color:#fff}
.mini{min-height:34px;padding:0 12px;border-radius:17px;background:var(--fill);font-size:14px;font-weight:600}.mini.g{background:var(--green);color:#fff}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:640px;max-height:calc(100% - 44px - env(safe-area-inset-top));overflow:auto;background:#f4f2f0;border-radius:16px 16px 0 0;z-index:9;transform:translateY(102%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.25,1),visibility 0s .38s;padding:0 16px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet .group{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
.shnav{position:sticky;top:0;background:#f4f2f0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;margin:0 -16px;padding:0 16px;z-index:1}
.shnav::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--l3)}
.shnav b{font-weight:600}
.shnav .nbtn:last-child{justify-self:end;font-weight:600}
.in-cell{flex:1;border:0;background:none;min-height:44px;font-size:17px;outline:none;padding:0}
.in-cell::placeholder{color:var(--l3)}
.pbox{flex:none;display:flex;align-items:center;gap:4px;width:118px;height:40px;padding:0 10px;border-radius:10px;background:var(--fill);border:1px solid var(--sep);cursor:text}
.pbox:focus-within{border-color:var(--tint);background:#fff}
.pbox span{font-size:13px;color:var(--l2);flex:none}
.price{flex:1;width:100%;border:0;background:none;outline:none;font-size:17px;text-align:start;direction:ltr;padding:0;min-height:38px}
.price::placeholder{color:var(--l3);direction:rtl;text-align:right}
.minus{width:24px;height:24px;border-radius:50%;background:#B4473A;display:grid;place-items:center;flex:none}
.minus i{width:11px;height:2px;background:#fff;border-radius:2px}
.dd{flex:none;width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.dd svg{width:12px;height:8px;fill:none;stroke:var(--l2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sugg{position:relative;max-height:268px;overflow-y:auto;overscroll-behavior:contain;background:rgba(118,118,128,.07);padding:4px 0 6px;animation:fd .18s ease both}
.sugg button{display:block;width:100%;text-align:start;min-height:44px;padding:0 16px;padding-inline-start:52px;font-size:17px;position:relative}
.sugg button+button::before{content:"";position:absolute;top:0;inset-inline-start:52px;inset-inline-end:0;border-top:.5px solid var(--sep)}
.sugg button:active{background:var(--fill)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips button{min-height:40px;padding:0 6px;border-radius:19px;background:#fff;font-size:15px;box-shadow:var(--sh)}
.chips button.sel{background:var(--tint);color:#fff}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px;background:#fff;font-size:13px;font-weight:500;border:2px solid transparent;box-shadow:var(--sh)}
.cats button .tile{width:40px;height:40px;border-radius:11px}
.cats button .tile svg.i{width:22px;height:22px}
.cats button.sel{border-color:var(--tint)}
.locb{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:0 10px;border-radius:17px;background:var(--fill);color:var(--tintT);font-size:14px;font-weight:600}
.locb svg.i{width:16px;height:16px}.locb.on{background:rgba(52,199,89,.15);color:var(--greenT)}
.cell[hidden]{display:none}
.locpanel{display:block}.lp{display:grid;gap:10px;padding:4px 0}
.lp small{color:var(--l2);font-size:13px}
.lp #loc{background:var(--fill);border-radius:10px;padding:0 12px}
.mapbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapbtns a{display:flex;align-items:center;gap:8px;justify-content:center;min-height:46px;border-radius:12px;background:var(--fill);font-weight:600;font-size:15px}
.mapbtns .mi{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff}.mapbtns .mi svg.i{width:15px;height:15px}
.dh{text-align:center;margin:0 0 18px}
.dh .tile{margin:4px auto 10px;border-radius:17px}
.dh .lt{margin:0 0 10px;font-size:30px}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.mc{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;background:var(--glass);box-shadow:var(--sh);font-size:14px;font-weight:500;color:var(--l2);max-width:100%}
.mc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.mc svg.i{width:16px;height:16px;flex:none}
.mc.lk{color:var(--tintT)}.mc.lk .chev{width:7px;height:12px;color:var(--tintT);opacity:.7}
.rn{color:var(--tintT);font-weight:600;font-size:15px;min-height:32px}
.msearch:focus-within{box-shadow:0 0 0 2px var(--tint)}
.msearch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px;box-shadow:var(--sh);margin-top:4px}
.msearch svg.i{width:18px;height:18px;color:var(--l2)}
.msearch input{flex:1;border:0;outline:none;background:none;min-height:44px;font-size:17px}
.mres{margin-top:8px;max-height:240px;overflow:auto}
.mres[hidden]{display:none}
.mres .cell small{display:block}
.mapwrap{position:relative;height:min(48vh,420px);margin-top:12px;border-radius:16px;overflow:hidden;box-shadow:var(--sh);background:#e9e5df}
#map{position:absolute;inset:0}
.mpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;z-index:500;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));transition:transform .15s}
.mapwrap.moving .mpin{transform:translate(-50%,-112%)}
.mme{position:absolute;bottom:12px;left:12px;z-index:600;width:44px;height:44px;border-radius:12px;background:#fff;color:#0a84ff;display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(0,0,0,.35)}
.mme svg.i{width:20px;height:20px}
.maplink{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:14px;font-weight:600;color:var(--tintT);background:rgba(255,138,0,.12);padding:4px 10px;border-radius:99px}
.maplink svg.i{width:15px;height:15px}
.nbtn#helpB:not(.help){font-weight:600;justify-self:end}
.dtin{border:0;background:var(--fill);border-radius:8px;padding:6px 12px;font-size:17px;min-width:110px}
.tsum{display:flex;justify-content:space-between;align-items:baseline;margin:14px 16px 0;font-weight:600}
.big-amt{text-align:center;padding:10px 0 4px}
.big-amt .who{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.big-amt .who .av{width:56px;height:56px;font-size:22px}
.big-amt .who svg{color:var(--l3)}
.big-amt b{display:block;font-size:52px;font-weight:600;letter-spacing:0;line-height:1}
.big-amt span{color:var(--l2)}
.copy{color:var(--tintT);font-weight:500;font-size:16px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.copy svg.i{width:18px;height:18px}
.ltr{direction:ltr;unicode-bidi:embed}

/* welcome */
.wel{padding:8px 8px 4px;text-align:center}
.wel .appic{width:84px;height:84px;border-radius:22px;margin:18px auto 14px;display:grid;place-items:center;background:linear-gradient(140deg,#ffb347,#ff7a00 55%,#ff4d6d);color:#fff;box-shadow:0 14px 30px -14px rgba(255,100,0,.8)}
.wel .appic svg.i{width:46px;height:46px}
.appic{display:grid;place-items:center;overflow:hidden}.appic img.lgimg{width:100%;height:100%;display:block}
.empty .appic.sm{width:72px;height:72px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(150deg,var(--a1),var(--a3));box-shadow:var(--e-hero)}
.wel h2{font-size:30px;font-weight:600;margin:0 0 4px;letter-spacing:0}
.wel>p{color:var(--l2);margin:0 0 24px}
.feat{display:flex;gap:14px;text-align:start;margin:0 6px 20px;align-items:flex-start}
.feat .ico{width:42px;height:42px;border-radius:12px}
.feat .ico svg.i{width:24px;height:24px}
.feat b{display:block;font-weight:600;margin-bottom:2px}
.feat span{color:var(--l2);font-size:15px}

.demobar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#c47cff,#8e44ff);color:#fff;border-radius:16px;padding:12px 14px;margin:4px 0 16px;box-shadow:0 12px 28px -16px #8e44ff}
.demobar span{flex:1;font-size:14px;line-height:1.35}.demobar b{display:block;font-size:15px}
.demobar .mini{background:#fff;color:#7a35e6;white-space:nowrap}
.empty{text-align:center;padding:40px 24px 24px}
.empty h2{font-size:22px;margin:0 0 6px}
.empty p{color:var(--l2);margin:0 auto 4px;max-width:320px;font-size:16px}
.note{font-size:13px;color:var(--l2);text-align:center;margin:4px 16px 12px}
.hud{position:fixed;top:50%;left:50%;width:160px;padding:22px 12px 16px;transform:translate(-50%,-50%) scale(.9);border-radius:16px;background:rgba(242,242,247,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);text-align:center;font-size:15px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;color:var(--l2);box-shadow:0 10px 30px -10px rgba(0,0,0,.2)}
.hud.on{opacity:1;transform:translate(-50%,-50%)}
.hud svg.i{width:44px;height:44px;display:block;margin:0 auto 8px;stroke-width:2.4}
.fade{animation:fd .32s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
input.in-cell:focus-visible,input.price:focus-visible,#mq:focus-visible{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}

/* ===== DESIGN SYSTEM: emerald · ivory · gold =====
   surfaces: ivory canvas, white cards, one emerald hero per screen; gold only for the main action on emerald.
   type: IBM Plex Sans Arabic, 4 sizes (32 / 22 / 16 / 13), tabular numbers.
   motion: 120ms press, 220–380ms entrances on route change only, spring sheets; all off with reduced motion. */
:root{
 --bg:#F5F3EC;--surface:#FFFFFF;--surface2:#FBFAF6;
 --ink:#0F1E17;--ink2:#4A5750;--ink3:#8A948E;
 --a1:#1C7A5A;--a2:#14634A;--a3:#0E4A38;
 --emerald:#17694F;--emerald-d:#0E4A38;--emerald-l:rgba(23,105,79,.08);--emerald-m:rgba(23,105,79,.14);
 --gold:#E6C46E;--gold-h:#EDD08C;--gold-ink:#2A210B;
 --danger:#B3473B;--danger-l:rgba(179,71,59,.08);--success:#1F8A5B;
 --line:rgba(18,33,26,.08);--line2:rgba(18,33,26,.13);
 --r-s:12px;--r-m:16px;--r-l:24px;
 --e1:0 1px 2px rgba(14,40,30,.06),0 6px 18px -8px rgba(14,40,30,.16);
 --e2:0 1px 2px rgba(14,40,30,.05),0 14px 30px -14px rgba(14,40,30,.18);
 --e-hero:0 1px 2px rgba(15,30,23,.08),0 18px 36px -22px rgba(15,30,23,.4);
 --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.22,1,.36,1);
 --gold-d:#9C7A2B;
 /* map old names onto the system so every screen follows it */
 --glass:var(--surface);--fill:var(--emerald-l);--sep:var(--line);--l1:var(--ink);--l2:var(--ink2);--l3:var(--ink3);
 --tint:var(--emerald);--tintT:var(--emerald);--green:var(--success);--greenT:var(--emerald);--redT:var(--danger);
 --nav:rgba(245,243,236,.82);--sh:var(--e1)}
html{background:var(--bg)}
body{background:var(--bg);
 font-family:"IBM Plex Sans Arabic",-apple-system,"SF Arabic",system-ui,sans-serif;color:var(--ink);font-size:16px;line-height:1.5;letter-spacing:0}
.num{font-variant-numeric:tabular-nums lining-nums}
svg.i{stroke-width:1.75}

/* nav */
.nav{transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.nav.solid{background:var(--nav);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);box-shadow:0 1px 0 var(--line)}
.ntitle{font-weight:600;font-size:16px}
.nbtn{color:var(--emerald);font-weight:500;border-radius:10px;transition:opacity .15s,background .15s}
.help{background:var(--surface);color:var(--ink2);box-shadow:var(--e1);font-weight:500}

/* type */
main{max-width:600px;padding:4px 20px calc(120px + env(safe-area-inset-bottom))}
.lt{font-size:32px;font-weight:600;letter-spacing:0;line-height:1.3}
.lsub{font-size:15px;color:var(--ink2);margin:4px 2px 22px}
.gh{font-size:14px;font-weight:600;color:var(--ink);margin:28px 6px 8px;letter-spacing:0}
.gf{font-size:13px;color:var(--ink2);margin:10px 6px 0}
.note{color:var(--ink3);background:none;border:0;padding:0;margin:0 0 16px;text-align:center}
.rn{color:var(--emerald)}

/* surfaces */
.group,.pc,.hero,.tg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--e1);-webkit-backdrop-filter:none;backdrop-filter:none}
.cell{min-height:54px;padding:12px 16px;gap:14px}
.cell+.cell::before,.cell+.sugg::before{border-top:1px solid var(--line)}
.cell .tx small{color:var(--ink2);font-size:13px;margin-top:1px}
.cell.danger,.cell.danger .tx{color:var(--danger)}
.ico{width:32px;height:32px;border-radius:9px;background:var(--emerald-l)!important;color:var(--emerald)}
.ico svg.i{width:18px;height:18px}
.cell.danger .ico{background:var(--danger-l)!important;color:var(--danger)}
.chev{color:var(--ink3)}

/* home cards */
.pc{padding:16px 18px;margin-bottom:14px;border-radius:20px;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.pc-top b{font-size:17px;font-weight:600}
.pc-top small{font-size:13px;color:var(--ink2)}
.pc-bot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.todo{background:var(--emerald);color:#fff;font-size:13px;font-weight:600;padding:6px 12px}
.todo.ok{background:var(--emerald-l);color:var(--emerald)}
.todo.wait{background:#F0EEE7;color:var(--ink2)}
.pc.arch .tile{background:#EEECE5!important;color:var(--ink2)}

/* tiles + avatars */
.tile{border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);background:linear-gradient(150deg,var(--a1),var(--a3))!important}
.tile svg.i{stroke-width:1.75}
.av{font-weight:600;text-shadow:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.stack .av{border:2px solid var(--surface)}
.stack .more{background:#EFEDE6;color:var(--ink2)}

/* header */
.dh{text-align:start;margin:4px 2px 18px}
.dh .top{display:flex;align-items:center;gap:14px}
.dh .tile{margin:0;width:52px;height:52px;border-radius:15px}
.dh .lt{margin:0;font-size:28px}
.dh .meta{justify-content:flex-start;gap:18px;margin-top:12px}
.mc{background:none;box-shadow:none;padding:0;min-height:24px;color:var(--ink2);font-weight:400;font-size:14px}
.mc.lk{color:var(--emerald);font-weight:500}

/* progress */
.steps2{margin:0 2px 16px}
.steps2 .bars{display:flex;gap:6px}
.steps2 .bars i{flex:1;height:4px;border-radius:2px;background:#E4E1D8;position:relative;overflow:hidden}
.steps2 .bars i.on{background:var(--emerald)}
.steps2 small{display:block;margin-top:8px;font-size:13px;color:var(--ink2)}
.steps2 small b{color:var(--ink);font-weight:600}

/* hero (action card) */
.act{background:linear-gradient(155deg,var(--a1) 0%,var(--a2) 48%,var(--a3) 100%)!important;border-radius:var(--r-l);padding:22px 20px 20px;box-shadow:var(--e-hero);isolation:isolate}
.act::after{display:none}
.act .k{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:500;padding:4px 12px;letter-spacing:0}
.act h2{font-size:clamp(24px,6.6vw,28px);font-weight:600;line-height:1.35;margin:12px 0 4px;letter-spacing:0}
.act p{font-size:15px;opacity:.85}
.act .pill{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.14)}
.act .pill.w{background:var(--gold);color:var(--gold-ink);border-color:transparent;box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}
.act .acct{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-s)}
.act .acct .copy{background:rgba(255,255,255,.14)}
.act .field{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.act .lnk{opacity:.9}
.cdl{opacity:.85}
.poll{gap:16px;margin-top:18px}
.oc{border:1.75px solid rgba(255,255,255,.55);width:26px;height:26px}
.opt.on .oc{background:var(--gold);border-color:var(--gold)}
.oc svg{stroke:var(--gold-ink)}
.ot b{font-size:18px;font-weight:600}
.obar{background:rgba(255,255,255,.14);height:6px}
.obar i{background:var(--gold);animation:grow .7s var(--ease) both}
.seev{border-top:1px solid rgba(255,255,255,.14);font-weight:500;margin-top:20px}
.ring .fg{stroke:var(--gold)!important}
.ring circle:first-child{stroke:rgba(255,255,255,.16)!important}

/* buttons: one primary style, one secondary, clear states */
.pill{border-radius:14px;min-height:52px;font-weight:600;transition:transform .12s var(--ease),filter .15s,background .15s,opacity .15s}
.pill.pri{background:var(--emerald);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),var(--e1)}
.pill:disabled,.pill[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}
.tst{border-radius:999px;min-height:34px;font-size:13px;transition:transform .12s var(--ease),filter .15s}
.tst.go{background:var(--emerald);color:#fff}
.tst.ok{background:var(--emerald-l);color:var(--emerald)}
.mini{border-radius:999px;font-size:13px;transition:transform .12s var(--ease)}
.mini.g{background:var(--emerald)}
.chk{border-color:var(--ink3)}.chk.on{background:var(--emerald);border-color:var(--emerald)}
.copy{color:var(--emerald)}
.locb{background:var(--emerald-l);color:var(--emerald)}.locb.on{background:var(--emerald);color:#fff}
.chips button{background:var(--surface);border:1px solid var(--line2);box-shadow:none;font-weight:500;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.chips button.sel{background:var(--emerald);border-color:var(--emerald);color:#fff}
.cats button{background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--e1);transition:border-color .15s,transform .12s var(--ease)}
.cats button.sel{border-color:var(--emerald);box-shadow:0 0 0 3px var(--emerald-l)}
.cats .tile{width:42px;height:42px;border-radius:12px}

/* sheets */
.veil{background:rgba(10,25,19,.32);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px -20px rgba(10,25,19,.35);transition:transform .42s cubic-bezier(.2,.95,.25,1),visibility 0s .42s}
.sheet.on{transition:transform .42s cubic-bezier(.2,.95,.25,1)}
.shnav{background:var(--bg)}
.shnav b{font-weight:600}
.sheet .group{background:var(--surface);border:1px solid var(--line)}
.pbox{background:var(--surface2);border:1px solid var(--line2)}
.pbox:focus-within{border-color:var(--emerald);background:#fff;box-shadow:0 0 0 3px var(--emerald-l)}
.minus{background:var(--danger)}
.msearch{background:var(--surface);border:1px solid var(--line);box-shadow:var(--e1)}
.msearch:focus-within{box-shadow:0 0 0 3px var(--emerald-l);border-color:var(--emerald)}
.mapwrap{border:1px solid var(--line);box-shadow:var(--e1)}
.mme{color:var(--emerald)}

/* welcome */
.wel .appic{background:linear-gradient(150deg,var(--a1),var(--a3));box-shadow:var(--e-hero);border-radius:24px;color:#F3E6CF}
.feat .ico{background:var(--emerald-l)!important;color:var(--emerald);width:44px;height:44px;border-radius:13px}

/* list states */
.tsumm b{font-size:22px}
.tbar{background:var(--emerald-l)}.tbar i{background:var(--emerald);animation:grow .8s var(--ease) both}
.pos{color:var(--emerald)}.neg{color:var(--danger)}.okc{color:var(--emerald)}
.hud{background:rgba(255,255,255,.96);color:var(--ink);border:1px solid var(--line);box-shadow:var(--e2);border-radius:20px}
.hud svg.i{color:var(--emerald)}
.demobar{background:var(--ink);box-shadow:none}.demobar .mini{color:var(--ink)}
.fab .pill{min-height:56px;border-radius:16px;font-size:17px}

/* interaction states */
@media (hover:hover){
 .pc:hover{box-shadow:var(--e2)}
 .cell.tap:hover,.trb:hover{background:var(--surface2)}
 .pill:not(:disabled):hover{filter:brightness(1.05)}
 .act .pill.w:not(:disabled):hover{background:var(--gold-h)}
 .nbtn:hover{opacity:.75}
 .chips button:not(.sel):hover,.cats button:not(.sel):hover{border-color:var(--emerald-m)}
 .tst.go:hover,.mini:hover{filter:brightness(1.08)}
}
.pill:not(:disabled):active,.tst:active,.mini:active,.cats button:active,.chips button:active,.locb:active,.copy:active{transform:scale(.97)}
.cell.tap:active,.trb:active{background:var(--emerald-l)}
.pc:active{transform:scale(.985)}
button:focus-visible,a:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:12px}
.field:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button:disabled{cursor:not-allowed}

/* entrances: only when you open a screen, never on live updates */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.obar i,.tbar i{transform-origin:right center}
#app.enter>*{animation:rise .38s var(--ease) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}
#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(n+7){animation-delay:.24s}
.fade{animation:none}
@media (prefers-reduced-motion:reduce){#app.enter>*,.obar i,.tbar i{animation:none!important}}

.act .acct b.ltr{font-size:14px;letter-spacing:.01em;font-variant-numeric:tabular-nums;word-break:break-all}
.swipe{position:relative;margin-bottom:14px;overflow-x:clip}
.swipe .pc{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;transition:transform .38s var(--spring);will-change:transform}
.sw-l,.sw-r{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:10px;z-index:0}
.sw-l{left:2px}.sw-r{right:2px}
.swa{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;opacity:0;transform:scale(.4);transition:transform .32s var(--spring),opacity .2s}
.swb{width:60px;height:44px;border-radius:999px;display:grid;place-items:center;color:#fff;transition:background .15s,width .2s}
.swb svg.i{width:20px;height:20px;stroke-width:2}
.swl{font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.swa.sh .swb{background:var(--emerald)}.swa.dl .swb{background:var(--danger)}.swa.pn .swb{background:var(--gold);color:var(--gold-ink)}
.swa.pn{width:76px}.swa.pn .swb{width:72px}
.swa.armed .swb{background:#8E2A21}.swa.armed .swl{color:var(--danger);font-weight:600}
.swa:active .swb{filter:brightness(.9)}
.pinmark{display:inline-flex;vertical-align:-2px;margin-inline-end:6px;color:var(--gold-d)}.pinmark svg.i{width:15px;height:15px;stroke-width:2}
/* sheet handle + expanded state */
.shnav{touch-action:none;cursor:grab;padding-top:6px;height:62px}
.shnav::before{top:8px;width:40px;height:5px;margin-left:-20px;background:rgba(18,33,26,.22)}
.sheet.full{max-height:none;top:calc(env(safe-area-inset-top) + 10px)}
.sheet.mapmode{display:flex;flex-direction:column;overflow:hidden;padding:0 0 env(safe-area-inset-bottom)}
.sheet.mapmode .shnav{margin:0;padding:6px 16px 0;flex:none}
.mbody{flex:1;display:flex;flex-direction:column;min-height:0}
.mapmode .mapwrap{flex:1;position:relative;height:auto;margin:0;border-radius:0;border:0;box-shadow:none}
.mtop{position:absolute;top:12px;left:12px;right:12px;z-index:700}
.mtop .msearch{margin:0;box-shadow:var(--e2);border-radius:14px}
.mclr{width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--ink2);font-size:18px;line-height:1}
.mclr[hidden]{display:none}
#mq::-webkit-search-cancel-button,#mq::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.mtop .mres{margin-top:8px;max-height:46vh;box-shadow:var(--e2)}
.mic{width:34px;height:34px;border-radius:50%;background:var(--danger-l);color:var(--danger);display:grid;place-items:center;flex:none}
.mic svg.i{width:18px;height:18px}.mic.sm{width:30px;height:30px}
.mpin i{display:block;width:10px;height:4px;border-radius:50%;background:rgba(0,0,0,.25);margin:-2px auto 0;transition:transform .15s}
.mapwrap.moving .mpin i{transform:scale(1.6);opacity:.6}
.mme{bottom:16px;left:16px;width:48px;height:48px;border-radius:14px;box-shadow:var(--e2)}
.mme.busy svg{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.mcard{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:14px 16px 16px;box-shadow:0 -8px 24px -18px rgba(14,40,30,.4)}
.mrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mrow .tx{flex:1;display:flex;flex-direction:column}.mrow b{font-weight:600;font-size:16px}.mrow small{color:var(--ink2);font-size:12px;direction:ltr;text-align:right}
.mrm{display:block;margin:10px auto 0;color:var(--danger);font-size:14px;font-weight:500;min-height:32px}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.row-gh{display:flex;align-items:center;justify-content:space-between}
.ghb{color:var(--emerald);font-weight:600;font-size:13px;min-height:28px;padding:0 4px}
/* map type toggle */
.mlay{position:absolute;bottom:16px;right:16px;z-index:700;display:flex;background:rgba(255,255,255,.95);border-radius:12px;padding:3px;box-shadow:var(--e2)}
.mlay button{min-height:40px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);transition:background .15s,color .15s}
.mlay button.on{background:var(--emerald);color:#fff}
/* settings */
.prof .pf-top{display:flex;align-items:center;gap:16px;padding:18px 16px}
.prof .pf-top .av img{width:100%;height:100%;object-fit:cover}
.pf-btns{display:flex;flex-wrap:wrap;gap:8px}
.pill.sm2{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px;background:var(--emerald-l);color:var(--emerald);cursor:pointer}
.pill.sm2.ghost{background:transparent;color:var(--danger)}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:14px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--ink2);padding:4px 0;border-radius:12px}
.sw span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);transition:transform .15s var(--ease)}
.sw.on{color:var(--ink);font-weight:600}.sw.on span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--emerald)}
.sw:active span{transform:scale(.92)}
.help svg.i{display:block}
/* tab bar */
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;display:flex;flex-direction:column}
#scr{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.tabbar{position:relative;flex:none;z-index:6;display:grid;grid-template-columns:1fr 1fr;padding:6px 0 calc(4px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line2)}
.tabbar .ti{display:grid;place-items:center;width:64px;height:32px;border-radius:999px;transition:background .2s var(--ease)}
.tabbar a.on .ti{background:var(--emerald-m)}
.tabbar[hidden]{display:none}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;color:var(--ink3);font-size:11px;transition:color .15s}
.tabbar a b{font-weight:600}
.tabbar a.on{color:var(--emerald)}
.tabbar .ti svg.i{width:25px;height:25px}
.tabbar a:active .ti{transform:scale(.9)}
body.has-tabs main{padding-bottom:110px}
body.has-tabs .fab{bottom:calc(82px + env(safe-area-inset-bottom))}
/* segmented filter */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 18px;background:rgba(118,118,128,.1);border-radius:13px}
.seg2 button{min-height:38px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s var(--ease),color .2s,box-shadow .2s}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 2px 8px -4px rgba(0,0,0,.12)}
.seg2 button i{font-style:normal;font-size:12px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--emerald-l);color:var(--emerald);display:inline-grid;place-items:center}
.seg2.in{margin:12px;background:rgba(118,118,128,.1)}
.sw .bgs{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)!important;color:var(--ink)!important}
.sw.on .bgs{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--emerald)!important}
[dir=ltr] .chev,[dir=ltr] #back svg,[dir=ltr] .big-amt .who svg{transform:scaleX(-1)}
[dir=ltr] body{font-family:-apple-system,"SF Pro Text","IBM Plex Sans Arabic",system-ui,sans-serif}
.swatches.s6{grid-template-columns:repeat(6,minmax(0,1fr))}
.swatches.s6 .sw span{width:40px;height:40px}
.chips button,.cats button,.msearch,.mcard,.mme,.hud{background:var(--surface)}
.pbox:focus-within{background:var(--surface)}
/* larger screens */
@media (min-width:768px){
 main{padding-top:12px}
 .lt{font-size:36px}
 .sheet{max-width:560px;bottom:24px;border-radius:24px}
 .fab{max-width:560px}
}

function enCount(s){s=s.trim();if(/^شخصين$/.test(s))return '2 people';if(/^تحويلين$/.test(s))return '2 transfers';if(s==='شخص')return '1 person';if(s==='تحويل')return '1 transfer';
  const m=s.match(/^(\d+) (\S+)$/);if(m){const map={'أشخاص':'people','شخص':'people','تحويلات':'transfers','تحويل':'transfers','قطّات':'pools','قطّة':'pools','أصوات':'votes'};return `${m[1]} ${map[m[2]]||m[2]}`}return s}
function enDur(s){s=s.trim();const t={'دقيقة':'1 min','دقيقتين':'2 min','ساعة':'1 hour','ساعتين':'2 hours','ساعة ونص':'1.5 hours','ساعتين ونص':'2.5 hours'};if(t[s])return t[s];
  const m=s.match(/^(\d+) (دقايق|دقيقة|ساعات|ساعة)$/);if(m)return m[1]+(/دق/.test(m[2])?' min':' hours');return s}
function enTime(s){return s.replace(/^الساعة /,'at ').replace(/ م$/,' PM').replace(/ ص$/,' AM')}
function tr(s){if(LANG!=='en'||!s)return s;const k=s.trim();if(!k||!/[؀-ۿ]/.test(k))return s;
  if(EN[k]!=null)return s.replace(k,EN[k]);
  for(const [re,f] of ENP){if(!f)continue;const m=k.match(re);if(m)return s.replace(k,f(...m))}
  /* last resort: translate counts and currency inside mixed text */
  const t=k.replace(/(\d+) (أشخاص|شخص)/g,'$1 people').replace(/شخصين/g,'2 people').replace(/ر\.س/g,'SAR').replace(/ (م|ص)$/,m=>m===' م'?' PM':' AM');
  return t!==k?s.replace(k,t):s}
function trNode(n){if(LANG!=='en')return;if(n.nodeType===3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
  if(n.nodeType!==1||n.closest&&n.closest('[data-raw]'))return;
  for(const a of ['placeholder','aria-label','title']){const v=n.getAttribute&&n.getAttribute(a);if(v){const t=tr(v);if(t!==v)n.setAttribute(a,t)}}
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let x;while((x=w.nextNode())){if(x.nodeType===3){const v=tr(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v}else for(const a of ['placeholder','aria-label','title']){const v=x.getAttribute(a);if(v){const t=tr(v);if(t!==v)x.setAttribute(a,t)}}}}
const trObs=new MutationObserver(ms=>{if(LANG!=='en')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(trNode)}});
function applyLang(){const en=LANG==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';trObs.disconnect();
  if(en){trNode(document.body);trObs.observe(document.body,{childList:true,subtree:true,characterData:true})}}
function setLang(l){LANG=l==='en'?'en':'ar';try{localStorage.setItem('qatta-lang',LANG)}catch(e){}

/* Firebase: anonymous sign-in + Firestore, wrapped in the same small API the app already uses */
async function firebaseDB(cfg){
  const V='10.12.2',base='https://www.gstatic.com/firebasejs/'+V+'/';
  const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(cfg),auth=Au.getAuth(app);
  let fs;try{fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){try{fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true})}catch(_){fs=F.getFirestore(app)}}
  if(auth.authStateReady)await auth.authStateReady();
  const u=auth.currentUser||(await Au.signInAnonymously(auth)).user;
  const flat=(o,pre='',out={})=>{for(const k in o){const v=o[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length)flat(v,pre+k+'.',out);else out[pre+k]=v}return out};
  const snapD=(s)=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const doc=p=>{const r=F.doc(fs,p);return{path:p,set:d=>F.setDoc(r,d),update:d=>F.updateDoc(r,flat(d)),delete:()=>F.deleteDoc(r),collection:c=>coll(p+'/'+c),onSnapshot:(cb,err)=>F.onSnapshot(r,s=>cb(snapD(s)),err)}};
  const coll=p=>({path:p,doc:id=>doc(p+'/'+(id||rid())),onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,p),s=>cb({docs:s.docs.map(x=>({id:x.id,data:()=>x.data()})),metadata:s.metadata}),err)});
  const uref=F.doc(fs,'users/'+u.uid);
  return{uid:u.uid,doc,collection:coll,
    watchMyPools:cb=>F.onSnapshot(uref,s=>cb((s.exists()&&s.data().pools)||[]),()=>cb([])),
    addPool:id=>F.setDoc(uref,{pools:F.arrayUnion(id)},{merge:true}),
    removePool:id=>F.setDoc(uref,{pools:F.arrayRemove(id)},{merge:true}),
    setName:n=>F.setDoc(uref,{name:n},{merge:true}),
    setPhoto:v=>F.setDoc(uref,{photo:v},{merge:true})};
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function attempt(fn){let last;

  throw last}
function saveError(e){const c=e&&e.code;console.warn('save failed',c,e);

/* ---------- maths ---------- */
function calc(ps,hub){
  const g=ps.filter(p=>p.going),n=g.length;
  const spent={};g.forEach(p=>spent[p.k]=(p.items||[]).reduce((a,i)=>a+(+i.p||0),0));
  const t=Object.values(spent).reduce((a,b)=>a+b,0),share=n?t/n:0;
  const net={};g.forEach(p=>net[p.k]=Math.round((spent[p.k]-share)*100)/100);
  const T=[];
  if(hub&&g.some(p=>p.k===hub)){
    /* everyone settles with the pool owner only: one transfer each */
    g.forEach(p=>{if(p.k===hub)return;const v=net[p.k];
      if(v<-0.009)T.push({f:p.k,t:hub,a:Math.round(-v*100)/100});
      else if(v>0.009)T.push({f:hub,t:p.k,a:Math.round(v*100)/100})});
  }
  const deb=hub&&g.some(p=>p.k===hub)?[]:g.filter(p=>net[p.k]<-0.009).map(p=>({k:p.k,a:-net[p.k]})).sort((a,b)=>b.a-a.a);
  const cre=hub&&g.some(p=>p.k===hub)?[]:g.filter(p=>net[p.k]>0.009).map(p=>({k:p.k,a:net[p.k]})).sort((a,b)=>b.a-a.a);
  let i=0,j=0;
  while(i<deb.length&&j<cre.length){const a=Math.min(deb[i].a,cre[j].a);
    if(a>0.009)T.push({f:deb[i].k,t:cre[j].k,a:Math.round(a*100)/100});
    deb[i].a-=a;cre[j].a-=a;if(deb[i].a<0.01)i++;if(cre[j].a<0.01)j++}
  const by=Object.fromEntries(ps.map(p=>[p.k,p]));
  T.forEach(x=>x.done=!!(by[x.f]&&by[x.f].paid&&by[x.f].paid[x.t]));
  const sum=T.reduce((a,x)=>a+x.a,0),got=T.filter(x=>x.done).reduce((a,x)=>a+x.a,0);
  return{g,n,t,share,spent,net,T,sum,got,by};
}

  const el=$('nk'),nk=el?el.value.trim():'';
